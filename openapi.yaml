openapi: 3.1.0
info: 
  title: Library api
  version: 1.0.0
servers:
  - url: https://my-best-library.com/api/v1
paths:
  /books:
    get:
      operationId: listBooks
      responses: 
        "200":
          description: "Успешный возврат списка книг. Может быть пустой список"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорретные параметры запроса"
        "5XX":
          $ref: '#/components/responses/ErrorResponse'
          description: "Внутренняя ошибка сервера"
    
    post:
      operationId: createBook
      responses:
        "201":
          description: "Успешное создание книги"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорретные параметры запроса"
        "422":
          $ref: "#/components/responses/ErrorResponse"
          description: "Параметры запроса не проходят валидацию"
        "5XX":
          $ref: '#/components/responses/ErrorResponse'
          description: "Внутренняя ошибка сервера"
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 0}
    get:
      operationId: getBook
      responses:
        "200":
          description: "Успешный возврат книги"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорретные параметры запроса"
        "404":
          $ref: "#/components/responses/ErrorResponse"
          description: "Запрашиваемый ресурс не найден"
        "5XX":
          $ref: '#/components/responses/ErrorResponse'
          description: "Внутренняя ошибка сервера"
    put:
      operationId: replaceBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        "200":
          description: "Книга полностью заменена"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорректные параметры запроса"
        "404":
          $ref: "#/components/responses/ErrorResponse"
          description: "Запрашиваемый ресурс не найден"
        "422":
          $ref: "#/components/responses/ErrorResponse"
          description: "Параметры запроса не проходят валидацию"
        "5XX":
          $ref: '#/components/responses/ErrorResponse'
          description: "Внутренняя ошибка сервера"
    patch:
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        "200":
          description: "Книга частично обновлена"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорректные параметры запроса"
        "404":
          $ref: "#/components/responses/ErrorResponse"
          description: "Запрашиваемый ресурс не найден"
        "422":
          $ref: "#/components/responses/ErrorResponse"
          description: "Параметры запроса не проходят валидацию"
        "5XX":
          $ref: '#/components/responses/ErrorResponse'
          description: "Внутренняя ошибка сервера"
    delete:
      operationId: deleteBook
      responses:
        "204":
          description: "Книга удалена"
        "400":
          $ref: "#/components/responses/ErrorResponse"
          description: "Некорректные параметры запроса"
        "404":
          $ref: "#/components/responses/ErrorResponse"
          description: "Запрашиваемый ресурс не найден"
        "5XX":
          $ref: "#/components/responses/ErrorResponse"
          description: "Внутренняя ошибка сервера"
      

components:
  schemas:

    Error:
      type: object
      required: []
      properties: 
        status_code: {type: integer}
        code:
          type: string
          description: "Машинночитаемая ошибка"
        message:
          type: string
          description: "Подробное описание ошибки для клиента"
    Pagination:
      type: object
      required: [page, per_page, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: "Номер текущей страницы"
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: "Количество элементов на странице"
        total:
          type: integer
          minimum: 0
          description: "Общее количество элементов"
        total_pages:
          type: integer
          minimum: 0
          description: "Общее количество страниц"

    Book:
      type: object
      required: [id, title, author, isbn, available_copies]
      properties:
        id: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: 
          type: string 
          minLength: 10 
          maxLength: 13
          examples: 
            - "0-13-235088-2"
            - "978-0132350884"
        published_year: { type: integer, minimum: 0, maximum: 2100 }
        total_copies:
          type: integer
          minimum: 0
          description: "Общее количество копий. Должно быть не больше, 
            чем available_copies (проверяется на сервере)"
        available_copies: { type: integer, readOnly: true,  minimum: 0}
    BookList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        pagination:
          $ref: "#/components/schemas/Pagination"
    BookPatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn:
          type: string
          minLength: 10
          maxLength: 13
          examples:
            - "0-13-235088-2"
            - "978-0132350884"
        published_year: { type: integer, minimum: 0, maximum: 2100 }
        total_copies: { type: integer, minimum: 0 }

    Reader:
      type: object
      required: [id, email]
      properties: 
        id: { type: integer, minimum: 0 }
        full_name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        registered_at: 
          type: integer
          description: "Время регистрации в UNIX формате"
          minimum: 0

    Loan:
      type: object
      required: [id, book_id, reader_id, loaned_at, due_date, returned_at]
      properties: 
        id: { type: integer, minimum: 0 }
        book_id: { type: integer, minimum: 0 }
        reader_id: { type: integer, minimum: 0 }
        loaned_at: 
          type: integer
          description: "Время взятия книги в UNIX формате"
          minimum: 0
        due_date:
          type: integer
          description: "Срок, до которого надо вернуть книгу в UNIX формате"
          minimum: 0
        returned_at:
          type: [integer, "null"]
          description: "Время возврата книги в UNIX формате"
          minimum: 0
  responses:
    ErrorResponse:
      description: "Ошибка"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
